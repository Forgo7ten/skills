name: Skills repository CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: skills-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills and generated marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated marketplace argument forwarding (without separator)
        run: pnpm run skills:sync --check

      - name: Check generated marketplace argument forwarding (with separator)
        run: pnpm run skills:sync -- --check

      - name: Validate Skills repository
        run: pnpm run skills:check

      - name: Run automated tests
        run: pnpm test

      - name: Verify pnpm argument forwarding and Hook lifecycle
        run: |
          pnpm run hooks:install --force
          pnpm run hooks:uninstall
          pnpm run hooks:install -- --force
          pnpm run hooks:uninstall
          pnpm run hooks:uninstall
